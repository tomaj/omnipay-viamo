<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 690" role="img">
  <title>Viamo payment flow: purchase, scan and confirm, webhook, return URL</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9z" fill="#4ade80"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9z" fill="#38bdf8"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9z" fill="#9db5a6"/></marker>
  </defs>
  <rect width="940" height="690" rx="24" fill="#1b1b1f"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="20" y="24" width="180" height="56" rx="14" fill="#173524" stroke="#2e4537"/>
    <text x="110" y="49" font-size="16" font-weight="700" fill="#e6f4ea" text-anchor="middle">Customer</text>
    <text x="110" y="68" font-size="12" fill="#9db5a6" text-anchor="middle">browser or phone</text>
    <path d="M110 80V610" stroke="#2a3a30" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="260" y="24" width="180" height="56" rx="14" fill="#173524" stroke="#2e4537"/>
    <text x="350" y="49" font-size="16" font-weight="700" fill="#e6f4ea" text-anchor="middle">Your shop</text>
    <text x="350" y="68" font-size="12" fill="#9db5a6" text-anchor="middle">omnipay-viamo</text>
    <path d="M350 80V610" stroke="#2a3a30" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="500" y="24" width="180" height="56" rx="14" fill="#173524" stroke="#2e4537"/>
    <text x="590" y="49" font-size="16" font-weight="700" fill="#e6f4ea" text-anchor="middle">Viamo app</text>
    <text x="590" y="68" font-size="12" fill="#9db5a6" text-anchor="middle">on the phone</text>
    <path d="M590 80V610" stroke="#2a3a30" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="740" y="24" width="180" height="56" rx="14" fill="#173524" stroke="#2e4537"/>
    <text x="830" y="49" font-size="16" font-weight="700" fill="#e6f4ea" text-anchor="middle">Viamo</text>
    <text x="830" y="68" font-size="12" fill="#9db5a6" text-anchor="middle">server</text>
    <path d="M830 80V610" stroke="#2a3a30" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M110 120H342" stroke="#4ade80" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="230.0" y="110" font-size="13" font-weight="600" fill="#e6f4ea" text-anchor="middle">checkout</text>
    <rect x="238" y="138" width="224" height="46" rx="12" fill="#1f2a23" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="260" cy="161" r="11" fill="#22c55e"/>
    <text x="260" y="165.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="280" y="158" font-size="12.5" font-weight="700" fill="#e6f4ea">purchase()</text>
    <text x="280" y="175" font-size="11" fill="#9db5a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">signs the request, key1</text>
    <path d="M350 222H118" stroke="#4ade80" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="230.0" y="212" font-size="13" font-weight="600" fill="#e6f4ea" text-anchor="middle">QR code or app link</text>
    <text x="230.0" y="242" font-size="11.5" fill="#9db5a6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">viamo://?requestString=…*SIG:…</text>
    <path d="M110 290H582" stroke="#9db5a6" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#c)"/>
    <text x="350.0" y="280" font-size="13" font-weight="600" fill="#e6f4ea" text-anchor="middle">scan the QR code or open the link</text>
    <path d="M590 350H822" stroke="#9db5a6" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#c)"/>
    <text x="710.0" y="340" font-size="13" font-weight="600" fill="#e6f4ea" text-anchor="middle">check SIG, customer confirms</text>
    <path d="M830 410H358" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#b)"/>
    <text x="590.0" y="400" font-size="13" font-weight="600" fill="#e6f4ea" text-anchor="middle">POST webhook: JSON + signature</text>
    <text x="590.0" y="430" font-size="11.5" fill="#9db5a6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rid vs e2e result amount id, key2</text>
    <rect x="238" y="430" width="224" height="46" rx="12" fill="#1f2a23" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="260" cy="453" r="11" fill="#22c55e"/>
    <text x="260" y="457.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="280" y="450" font-size="12.5" font-weight="700" fill="#e6f4ea">webhook()</text>
    <text x="280" y="467" font-size="11" fill="#9db5a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verifies key2, result OK</text>
    <path d="M590 520H358" stroke="#4ade80" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="470.0" y="510" font-size="13" font-weight="600" fill="#e6f4ea" text-anchor="middle">GET rurl?responseString=…</text>
    <text x="470.0" y="540" font-size="11.5" fill="#9db5a6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BID:42*VS:…*RES:OK*SIG:…, key1</text>
    <rect x="238" y="558" width="224" height="46" rx="12" fill="#1f2a23" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="260" cy="581" r="11" fill="#22c55e"/>
    <text x="260" y="585.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="280" y="578" font-size="12.5" font-weight="700" fill="#e6f4ea">completePurchase()</text>
    <text x="280" y="595" font-size="11" fill="#9db5a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verifies BID and key1</text>
    <rect x="50" y="628" width="840" height="42" rx="12" fill="#173524"/>
    <text x="470" y="654" font-size="13" fill="#e6f4ea" text-anchor="middle">2 and 3 arrive in any order, or only one of them: find the order by VS, check the amount, mark it paid once.</text>
  </g>
</svg>
