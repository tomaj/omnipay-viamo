name: Bug report
description: Report a defect or unexpected behaviour in omnipay-viamo
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        If this is a security vulnerability (for example a payment accepted without a valid signature), do not continue. Report it privately at https://github.com/tomaj/omnipay-viamo/security/advisories/new (see SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong?
      placeholder: completePurchase() reports a failed payment when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger this?
      placeholder: |
        1. Create the gateway with...
        2. Call purchase() with...
        3. Open the return URL with responseString...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the exception message if there is one.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code sample
      description: The smallest snippet that shows the problem. Remove keys (key1, key2) and personal data.
      render: php
      placeholder: |
        $gateway = Omnipay::create('Viamo');
        $gateway->initialize(['bid' => '...', 'key1' => '...', 'key2' => '...']);
        $response = $gateway->completePurchase()->send();
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: omnipay-viamo version
      description: The version from composer, for example 5.0.0.
      placeholder: "5.0.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Output of `php -v`.
      placeholder: "8.4"
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: Operation
      description: Which operation is involved?
      options:
        - purchase()
        - completePurchase()
        - webhook()
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs or configuration (with keys removed), or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
